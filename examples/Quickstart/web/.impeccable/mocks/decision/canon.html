<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The category standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font:15px/1.5 system-ui,sans-serif;background:#f9fafb;color:#111827}
.wrap{width:780px;margin:0 auto;padding:32px 0;display:flex;flex-direction:column;gap:16px;height:900px}

.ask{margin-top:auto;background:#fff;border:1px solid #d1d5db;border-radius:24px;padding:14px 20px;color:#6b7280}

<div class="wrap">
  <h1>Ask the Online Safety Act 2021</h1>
  <div class="u">What is a social media service under the Act?</div>
  <div class="card"><h3>search_legislation · 10 facts · 6 sections</h3>
    <svg viewBox="0 0 740 300" width="100%" height="300">
      <g stroke="#9ca3af" stroke-width="1.5"><path d="M120 80L370 150"/><path d="M370 150L620 80"/><path d="M370 150L250 250"/><path d="M370 150L540 250"/></g>
      <g fill="#2563eb"><circle cx="120" cy="80" r="18"/><circle cx="370" cy="150" r="24"/><circle cx="620" cy="80" r="18"/><circle cx="250" cy="250" r="18"/><circle cx="540" cy="250" r="18"/></g>
      <text x="60" y="50">Online Safety Act 2021</text><text x="318" y="112">social media service</text><text x="596" y="50">end-user</text><text x="200" y="288">electronic service</text><text x="516" y="288">material</text>
    </svg>
  </div>
  <div class="card">A social media service is an electronic service whose sole or primary purpose is online social interaction between two or more end-users (s 13).</div>
